# Release build: no remote shell and no network firmware update on the node (EXTRA_CONF_FILE=release.conf,
# or -Dnode_EXTRA_CONF_FILE=release.conf in a sysbuild). Updates then go through SWD only -- or leave
# MCUMGR_TRANSPORT_UDP on and rely on the SMP filter (source address + `ota arm`), see README.
CONFIG_APP_BUS_SHELL=n
CONFIG_MCUMGR_TRANSPORT_UDP=n
CONFIG_MCUMGR=n
CONFIG_IMG_MANAGER=n
CONFIG_STREAM_FLASH=n
CONFIG_SHELL_BACKEND_DUMMY=n
