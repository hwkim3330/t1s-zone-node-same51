CONFIG_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_NET_LOG=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_MAX_CONTEXTS=12

# Static IPv4 (bench T1S subnet; EVB-LAN8670 on the PC uses .70)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.100.71"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ETH_LAN865X_IRQ_THREAD_STACK_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NET_STATISTICS_USER_API=y

# Identity kept across reboots (`t1s save`): settings on NVS in storage_partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Network firmware update: mcumgr SMP over UDP (port 1337) into MCUboot's second slot.
# Only takes effect in a sysbuild with MCUboot (sysbuild.conf); tools/smp_udp.py is the client.
CONFIG_NET_SOCKETS=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=n
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=n
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MCUMGR_TRANSPORT_UDP_STACK_SIZE=2048
CONFIG_REBOOT=y

# zenoh-pico client (src/zone_zenoh.c): POSIX sockets + pthreads, k_malloc heap
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_THREADS_NUM=3
CONFIG_POSIX_API=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_SOCKETS_POLL_MAX=8
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_MAX_CONN=12
# zenoh-pico makes a mutex/condvar per session object; the POSIX pools default to ~5
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=32
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_CBPRINTF_FP_SUPPORT=y

# PTP clock device + frame stamps from the LAN8651 (zephyr-patches/): used by the UDP 5007 lock and
# the lamps' blink phase. Standard gPTP is NOT on by default: with two SAM nodes its servo would steer
# the same TSU as the lock to the gateway. Experiments: -DEXTRA_CONF_FILE=gptp.conf (and no `ptp lock`).
CONFIG_PTP_CLOCK=y
CONFIG_NET_PKT_TIMESTAMP=y

# Hardware watchdog (main loop feeds it) and stack headroom (`kernel thread stacks`)
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_KERNEL_SHELL=y

# diagnostics: per-pool usage in 'net mem'
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y

# Socket receive/send timeouts (SO_RCVTIMEO): off by default, and then every timeout is silently
# ignored -- the PTP lock hung for ever on one lost reply, zenoh-pico's reads never time out.
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
