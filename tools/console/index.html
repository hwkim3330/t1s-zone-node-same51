<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T1S Bus Console</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#d9dce3;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--acc:#2563eb;--bus:#111827}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--mute:#8b93a1;--line:#2a2f38;--bus:#e5e7eb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:650}
header .sub{color:var(--mute);font-size:13px}
header .sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5}
main{padding:16px 20px;max-width:1280px;margin:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:inherit}
svg .mute{fill:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:14px}
.card h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--mute)}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
input{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 8px;min-width:0}
pre{background:var(--bg);border-radius:8px;padding:8px;font:12px/1.35 ui-monospace,Menlo,monospace;height:150px;overflow:auto;margin:8px 0 0;white-space:pre-wrap;word-break:break-all}
table{border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{border:1px solid var(--line);padding:4px 10px;text-align:center}
.legend{color:var(--mute);font-size:12px;margin-top:6px}

.zone{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:14px}
.zone h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center}
.zrow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
canvas.pan{border-radius:6px;background:#000;image-rendering:pixelated}
.gauge{width:110px;height:110px;border:1px solid var(--line);border-radius:8px;position:relative;background:var(--bg)}
.gauge i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--acc);transform:translate(-50%,-50%)}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar b{display:block;height:100%;background:var(--bad)}
.small{font-size:12px;color:var(--mute)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{padding:4px 9px;font-size:13px}
.car{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.car b{font-size:20px}
.lamp{width:14px;height:14px;border-radius:3px;display:inline-block;background:var(--line)}
pre.job{height:auto;max-height:220px}
@media (max-width:600px){header{flex-wrap:wrap}main{padding:12px 16px}}
</style>
</head>
<body>
<header>
  <h1>T1S Bus Console</h1><span class="sub" id="sub">—</span><span class="sp"></span>
  <button class="pri" id="pingall">전체 ping</button>
</header>
<main>
  <div class="panel"><svg id="topo" viewBox="0 0 1200 420"></svg>
    <div class="legend">초록 = 코디네이터 비컨 들림(PST=1) · 주황 = 링크는 있으나 비컨 없음 · 빨강 = 응답 없음 · 점선 = 아직 없는 노드 · 종단은 버스 양 끝(바깥쪽 SAM)만 — 가운데 ESP 는 OFF</div>
  </div>
  <div class="panel" id="pingbox" style="margin-top:14px;display:none"><b>ping 결과</b><div id="pingres"></div></div>
  <div class="panel" style="margin-top:14px">
    <div class="car" id="car">차 상태 —</div>
    <div class="btns">
      <button id="updAll">모든 노드 펌웨어 업데이트 (T1S 너머)</button>
      <button id="qosRun">PLCA 버스트 지연 측정 (~3 분)</button>
    </div>
    <pre class="job" id="jobs" style="display:none"></pre>
  </div>
  <div class="zone" id="zone"></div>
  <div class="cards" id="cards"></div>
</main>
<script>
const $ = s => document.querySelector(s);
let S = [], planned = 2;
const col = b => (Date.now()/1000 - b.seen > 12) ? 'var(--bad)' : (b.pst ? 'var(--ok)' : (b.link ? 'var(--warn)' : 'var(--bad)'));
const esc = s => String(s ?? '—').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function topo() {
  // ESP in the middle of the bus (the coordinator and gateway), SAM nodes on both sides;
  // only the two outermost nodes are terminated.
  const esp = S.filter(b => b.kind === 'esp'), sam = S.filter(b => b.kind === 'sam')
    .sort((a, b) => (a.plca_id ?? 99) - (b.plca_id ?? 99));
  const nodes = [...sam, ...Array(Math.max(0, 4 - sam.length)).fill(null)];
  const half = Math.ceil(nodes.length / 2), left = nodes.slice(0, half), right = nodes.slice(half);
  const W = 1200, cx0 = W / 2, busY = 250, x0 = 40, x1 = W - 40;
  const e = esp[0], lanUp = e && e.lan && e.lan.startsWith('up');
  let g = '';
  g += box(cx0 - 110, 10, 220, 62, 'PC / 스위치', '192.168.100.51 (USB LAN)', lanUp ? 'var(--ok)' : 'var(--mute)', !lanUp);
  g += `<line x1="${cx0}" y1="72" x2="${cx0}" y2="110" stroke="var(--mute)" stroke-width="2" ${lanUp ? '' : 'stroke-dasharray="6 5"'}/>`;
  g += `<text x="${cx0 + 10}" y="96" font-size="12" class="mute">100BASE-TX · ${lanUp ? '링크 업' : 'LAN 미연결'}${e?.mode === 'bridge' ? ' · 브리지 ↓ ' + esc(e.br_down) + ' · ↑ ' + esc(e.br_up) : ''}</text>`;
  if (e) g += box(cx0 - 110, 110, 220, 92, e.name, `PLCA ${e.plca_id}/${e.plca_count} ${e.plca_id === 0 ? '코디네이터' : ''}`, col(e), false, e.mode === 'bridge' ? '브리지 모드 · IP 없음' : `${esc(e.ip)} · 게이트웨이 · PTP 마스터`, '버스 중앙 · 종단 OFF');
  else g += box(cx0 - 110, 110, 220, 92, 'ESP 게이트웨이', '연결 안 됨', 'var(--bad)', true);
  g += `<line x1="${x0 + 60}" y1="${busY}" x2="${x1 - 60}" y2="${busY}" stroke="var(--bus)" stroke-width="5"/>`;
  g += `<line x1="${cx0}" y1="202" x2="${cx0}" y2="${busY}" stroke="var(--bus)" stroke-width="5"/>`;
  g += `<text x="${x0 + 70}" y="${busY - 12}" font-size="13" class="mute">10BASE-T1S 2선 버스 · 10 Mb/s 공유 · PLCA</text>`;
  g += term(x0 + 60, busY) + term(x1 - 60, busY);
  const place = (list, xa, xb) => list.forEach((b, i) => {
    const cx = list.length > 1 ? xa + i * (xb - xa) / (list.length - 1) : (xa + xb) / 2;
    g += `<line x1="${cx}" y1="${busY}" x2="${cx}" y2="${busY + 40}" stroke="var(--bus)" stroke-width="3" ${b ? '' : 'stroke-dasharray="5 4"'}/>`;
    const ptp = b && b.ptp_ns != null && Date.now() / 1000 - b.ptp_at < 30 ? ` · PTP ${b.ptp_ns > 0 ? '+' : ''}${b.ptp_ns} ns` : '';
    if (b) g += box(cx - 95, busY + 40, 190, 92, b.name, `PLCA ${b.plca_id ?? '?'} / ${b.plca_count ?? '?'}`, col(b), false, esc(b.ip) + ptp, b.mac ? b.mac : '');
    else g += box(cx - 95, busY + 40, 190, 92, 'SAM E51 (예정)', 'LAN8651 클릭', 'var(--mute)', true);
  });
  place(left, x0 + 120, cx0 - 140);
  place(right, cx0 + 140, x1 - 120);
  $('#topo').innerHTML = g;
}
function box(x, y, w, h, t1, t2, c, dashed, t3 = '', t4 = '') {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--card)" stroke="${c}" stroke-width="2.5" ${dashed ? 'stroke-dasharray="7 5"' : ''}/>
  <circle cx="${x + 16}" cy="${y + 20}" r="6" fill="${c}"/>
  <text x="${x + 30}" y="${y + 25}" font-size="14" font-weight="650">${esc(t1)}</text>
  <text x="${x + 14}" y="${y + 46}" font-size="13">${esc(t2)}</text>
  <text x="${x + 14}" y="${y + 64}" font-size="12" class="mute">${t3}</text>
  <text x="${x + 14}" y="${y + 80}" font-size="11" class="mute">${esc(t4)}</text>`;
}
const term = (x, y) => `<rect x="${x - 6}" y="${y - 12}" width="12" height="24" rx="2" fill="var(--warn)"/><text x="${x}" y="${y + 30}" font-size="11" text-anchor="middle" class="mute">종단</text>`;

function cards() {
  const root = $('#cards');
  S.forEach(b => {
    let c = document.getElementById('c' + b.i);
    if (!c) {
      c = document.createElement('div'); c.className = 'panel card'; c.id = 'c' + b.i;
      c.innerHTML = `<h3><span class="dot"></span><span class="nm"></span></h3><div class="kv"></div>
        <div class="row"><input class="id" placeholder="PLCA id" size="6"><input class="cnt" placeholder="count" size="5" value="8">
        <button class="setid">PLCA 적용</button></div>
        <div class="row"><input class="cmd" placeholder="콘솔 명령" style="flex:1"><button class="run">실행</button></div><pre></pre>`;
      c.querySelector('.setid').onclick = () => {
        const id = c.querySelector('.id').value.trim(), cnt = c.querySelector('.cnt').value.trim();
        if (!/^\d+$/.test(id)) return;
        cmd(b.i, b.kind === 'sam' ? `t1s plca ${id} ${cnt}` : `plca ${id} ${cnt}`);
      };
      const run = () => { const v = c.querySelector('.cmd').value.trim(); if (v) cmd(b.i, v, 3); };
      c.querySelector('.run').onclick = run;
      c.querySelector('.cmd').onkeydown = ev => ev.key === 'Enter' && run();
      root.appendChild(c);
    }
    c.querySelector('.dot').style.background = col(b);
    c.querySelector('.nm').textContent = b.name;
    c.querySelector('.kv').innerHTML = [
      ['포트', b.tty], ['시리얼', b.serial], ['PLCA', `${b.plca_id ?? '?'} / ${b.plca_count ?? '?'}`],
      ['비컨', b.pst == null ? '?' : (b.pst ? '들림 (PST=1)' : '없음')], ['IP', b.ip], ['MAC', b.mac],
      ['rx / tx', `${b.rx ?? '?'} / ${b.tx ?? '?'}`],
      ...(b.kind === 'sam' ? [['PTP 오프셋', b.ptp_ns == null ? '—' : `${b.ptp_ns} ns (지연 ${b.ptp_delay} ns)`]] : []), ...(b.kind === 'esp' ? [['모드', b.mode], ['LAN', b.lan], ['브리지 ↓', b.br_down], ['브리지 ↑', b.br_up]] : [])
    ].map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join('');
    const pre = c.querySelector('pre'), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
    if (!c.dataset.busy) { pre.textContent = b.log.join('\n'); if (atEnd) pre.scrollTop = pre.scrollHeight; }
  });
}
async function cmd(i, c, wait = 1.5) {
  const card = document.getElementById('c' + i), pre = card.querySelector('pre');
  card.dataset.busy = 1; pre.textContent = '> ' + c + '\n…';
  const r = await (await fetch('/api/cmd', {method: 'POST', body: JSON.stringify({i, cmd: c, wait})})).json();
  pre.textContent = '> ' + c + '\n' + r.out.join('\n');
  setTimeout(() => delete card.dataset.busy, 6000);
}
$('#pingall').onclick = async () => {
  const btn = $('#pingall'); btn.disabled = true; btn.textContent = 'ping 중…';
  $('#pingbox').style.display = ''; $('#pingres').textContent = '각 노드가 서로 3번씩 — 수십 초 걸린다';
  const r = await (await fetch('/api/ping', {method: 'POST', body: '{}'})).json();
  const names = [...new Set(r.flatMap(x => [x.src, x.dst]))]; const dsts = names.filter(n => n !== 'PC');
  const cell = (s, d) => { const x = r.find(y => y.src === s && y.dst === d); if (!x) return '<td>—</td>';
    const avg = x.ms.length ? (x.ms.reduce((a, b) => a + b, 0) / x.ms.length).toFixed(1) + ' ms' : '';
    return `<td style="color:${x.ok === 3 ? 'var(--ok)' : x.ok ? 'var(--warn)' : 'var(--bad)'}">${x.ok}/3 ${avg}</td>`; };
  $('#pingres').innerHTML = `<table><tr><th>보냄 ↓ / 받음 →</th>${dsts.map(n => `<th>${esc(n)}</th>`).join('')}</tr>` +
    names.map(s => `<tr><th>${esc(s)}</th>${dsts.map(d => s === d ? '<td>·</td>' : cell(s, d)).join('')}</tr>`).join('') + '</table>';
  btn.disabled = false; btn.textContent = '전체 ping';
};
async function tick() {
  try {
    S = await (await fetch('/api/state')).json();
    $('#sub').textContent = `${S.length}개 보드 · ${new Date().toLocaleTimeString()}`;
    topo(); cards();
  } catch (e) { $('#sub').textContent = '서버 연결 끊김'; }
}
tick(); setInterval(tick, 2000);

// ---------------------------------------------------------------- zone nodes (Zenoh side)
let Z = null;
const zmaps = [1, 0, 3, 2, 5, 4, 7, 6, 9, 8, 11, 10, 13, 12, 15, 14];   // serpentine first: the likely wiring
const boardFor = ip => S.find(b => b.kind === 'sam' && b.ip === ip);
function zoneCard(n) {
  let c = document.getElementById('z' + n.id);
  if (!c) {
    c = document.createElement('div'); c.className = 'panel'; c.id = 'z' + n.id;
    c.innerHTML = `<h3><span class="dot"></span><span class="t"></span></h3>
      <div class="zrow"><canvas class="pan" width="10" height="10" style="width:150px;height:150px"></canvas>
        <div style="flex:1;min-width:140px"><div class="small">PTP 오프셋 (게이트웨이 기준)</div>
          <svg class="spark" viewBox="0 0 120 40" style="width:100%;height:46px"></svg><div class="ptpv small"></div>
          <div class="sens" style="margin-top:6px"></div></div></div>
      <div class="btns">
        <button data-a="pattern">LED 배치 맞추기</button><button data-a="next" hidden>다음 배치 ▶</button>
        <button data-a="ok" hidden>이게 맞음 (저장)</button><button data-a="cancel" hidden>취소</button>
        <button data-a="sleep">슬립</button><button data-a="wake">깨우기</button><button data-a="diag">진단</button>
      </div><div class="small hint"></div><pre class="out" style="display:none"></pre>`;
    c.addEventListener('click', ev => zoneAct(n.id, ev.target.dataset.a));
    $('#zone').appendChild(c);
  }
  return c;
}
const zst = {};   // per node: map index while matching
async function zoneAct(id, a) {
  if (!a) return;
  const n = Z.nodes.find(x => x.id === id), b = n && n.hello && boardFor(n.hello.ip), c = document.getElementById('z' + id);
  if (!b) return;
  const run = async (cmd, wait = 1.5) => (await (await fetch('/api/cmd', {method: 'POST', body: JSON.stringify({i: b.i, cmd, wait})})).json()).out.join('\n');
  const show = (txt) => { const o = c.querySelector('.out'); o.style.display = ''; o.textContent = txt; };
  const vis = (on) => { for (const k of ['next', 'ok', 'cancel']) c.querySelector(`[data-a=${k}]`).hidden = !on;
                        c.querySelector('[data-a=pattern]').hidden = on; };
  if (a === 'pattern') {
    zst[id] = 0; await run('panel pattern on'); await run('panel map ' + zmaps[0]); vis(true);
    c.querySelector('.hint').textContent = '실제 LED 가 왼쪽 미리보기와 같아질 때까지 "다음 배치". 빨간 점 = 왼쪽 위, 초록 줄 = 위쪽(오른쪽으로 밝아짐), 파란 줄 = 왼쪽(아래로 밝아짐), 흰 점 하나.';
  } else if (a === 'next') {
    zst[id] = (zst[id] + 1) % zmaps.length; await run('panel map ' + zmaps[zst[id]]);
    c.querySelector('.hint').textContent = `배치 ${zst[id] + 1} / ${zmaps.length} (map ${zmaps[zst[id]]})`;
  } else if (a === 'ok' || a === 'cancel') {
    if (a === 'cancel') await run('panel map 1');
    await run('panel pattern off'); vis(false);
    c.querySelector('.hint').textContent = a === 'ok' ? `저장됨: map ${zmaps[zst[id]]}` : '';
  } else if (a === 'sleep') show(await run('t1s sleep both', 2));
  else if (a === 'wake') show(await run('t1s wake', 4));
  else if (a === 'diag') show(await run('t1s diag', 1.5));
}
function drawPanel(cv, b64) {
  const ctx = cv.getContext('2d'), img = ctx.createImageData(10, 10);
  if (b64) { const raw = atob(b64); for (let i = 0; i < 100; i++) { img.data[i * 4] = raw.charCodeAt(i * 3); img.data[i * 4 + 1] = raw.charCodeAt(i * 3 + 1); img.data[i * 4 + 2] = raw.charCodeAt(i * 3 + 2); img.data[i * 4 + 3] = 255; } }
  ctx.putImageData(img, 0, 0);
}
function spark(svg, v) {
  if (!v.length) { svg.innerHTML = ''; return; }
  const m = Math.max(50, ...v.map(Math.abs));
  const pts = v.map((y, i) => `${(i / Math.max(1, v.length - 1) * 120).toFixed(1)},${(20 - y / m * 18).toFixed(1)}`).join(' ');
  svg.innerHTML = `<line x1="0" y1="20" x2="120" y2="20" stroke="var(--line)"/><polyline fill="none" stroke="var(--acc)" stroke-width="1.5" points="${pts}"/>`;
}
async function zoneTick() {
  try { Z = await (await fetch('/api/zone')).json(); } catch (e) { return; }
  const car = Z.car, gear = {126: 'P', 127: 'D', 0: 'N', '-1': 'R'}[car['powertrain/transmission/selectedgear']] ?? '?';
  const lamp = (on, col) => `<span class="lamp" style="background:${on ? col : 'var(--line)'}"></span>`;
  $('#car').innerHTML = Z.car_age == null || Z.car_age > 3 ? '<span class="small">차 상태 없음 (zonelink/게이트웨이 확인)</span>' :
    `<span>기어 <b>${gear}</b></span><span><b>${(car.speed ?? 0).toFixed(1)}</b> km/h</span>
     <span>${['수동', '오토파일럿', 'Autoware'][car['private/drivingmode']] ?? ''}</span>
     <span>${lamp(car['body/lights/directionindicator/left/issignaling'], '#f59e0b')} 좌 ${lamp(car['body/lights/hazard/issignaling'], '#ef4444')} 비상 ${lamp(car['body/lights/directionindicator/right/issignaling'], '#f59e0b')} 우</span>
     <span>${lamp(car['body/lights/brake/isactive'], '#ef4444')} 브레이크 ${lamp(car['body/lights/backup/ison'], '#fff')} 후진</span>`;
  const js = Z.jobs, txt = Object.entries(js).filter(([k, v]) => v).map(([k, v]) => `[${k === 'update' ? '펌웨어 업데이트' : 'PLCA 버스트 측정'}] ${v.running ? '진행 중 (' + v.started + ' 시작)' : v.finished + ' 끝'}\n${v.out || ''}`).join('\n\n');
  $('#jobs').style.display = txt ? '' : 'none'; $('#jobs').textContent = txt;
  for (const n of Z.nodes) {
    if (n.id == null) continue;
    const c = zoneCard(n), h = n.hello || {};
    const live = n.hello_age < 5;
    c.querySelector('.dot').style.background = !live ? 'var(--bad)' : h.ptp_ns == null ? 'var(--warn)' : 'var(--ok)';
    c.querySelector('.t').textContent = `${h.role ?? "존 노드"} (sam${n.id}) · ${h.ip ?? "?"} · 가동 ${h.up ?? "?"} s${h.api ? " · API " + h.api : " · 옛 키"}`;
    drawPanel(c.querySelector('canvas'), n.panel);
    spark(c.querySelector('.spark'), n.ptp_hist);
    c.querySelector('.ptpv').textContent = h.ptp_ns == null ? '잠금 안 됨' : `지금 ${h.ptp_ns} ns · σ ${n.ptp_sd ?? '—'} ns (최근 2 분)`;
    const s = Z.sensors, sens = c.querySelector('.sens');
    // the sensors are published without a node id: show each on the node whose board reports that click
    const b = boardFor(h.ip), kind = b && b.slot3;
    sens.innerHTML = '';
  }
  // sensors: one block under the cards
  const s = Z.sensors;
  let sb = document.getElementById('sensbox');
  if (!sb) { sb = document.createElement('div'); sb.className = 'panel'; sb.id = 'sensbox'; $('#zone').appendChild(sb); }
  const gx = s.stick_x == null ? 50 : s.stick_x / 40.95, gy = s.stick_y == null ? 50 : 100 - s.stick_y / 40.95;
  const pm = s.prox_m == null ? 2 : s.prox_m;
  sb.innerHTML = `<h3>입력 클릭 (슬롯 3)</h3><div class="zrow">
    <div><div class="small">조이스틱 ${s.stick_x ?? '—'} / ${s.stick_y ?? '—'}</div><div class="gauge"><i style="left:${gx}%;top:${gy}%"></i></div></div>
    <div style="flex:1;min-width:150px"><div class="small">근접 ${s.prox_raw ?? '—'} (≈ ${pm.toFixed(2)} m)</div>
      <div class="bar"><b style="width:${Math.max(0, Math.min(100, (1 - Math.min(pm, 1)) * 100))}%"></b></div>
      <div class="small" style="margin-top:6px">${s.age == null ? '입력 없음' : s.age < 3 ? '실시간' : s.age + ' s 전'}</div></div></div>`;
}
$('#updAll').onclick = async () => { const r = await (await fetch('/api/zone/update', {method: 'POST', body: '{}'})).json(); if (!r.started) alert('업데이트를 시작할 수 없음 (진행 중이거나 노드/이미지 없음)'); };
$('#qosRun').onclick = async () => { const r = await (await fetch('/api/zone/qos', {method: 'POST', body: '{}'})).json(); if (!r.started) alert('이미 측정 중'); };
zoneTick(); setInterval(zoneTick, 1000);

</script>
</body>
</html>
