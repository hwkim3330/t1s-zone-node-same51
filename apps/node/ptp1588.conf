# Experiment (docs/2026-11-02_HARDENING.md, item 3): Zephyr's IEEE 1588 stack (UDP/IPv4, E2E, ordinary clock) on the
# LAN8651 TSU, beside the UDP 5007 lock. Domain 77 (set in ptp.c: no Kconfig for it in 3.7) so no PTP slave on the
# bench LAN follows it by accident.
# -Dnode_EXTRA_CONF_FILE=ptp1588.conf. Not with gptp.conf (Zephyr: PTP depends on !NET_GPTP).
CONFIG_PTP=y
CONFIG_PTP_UDP_IPv4_PROTOCOL=y
CONFIG_PTP_ORDINARY_CLOCK=y
CONFIG_PTP_PRIORITY1=250
CONFIG_PTP_LOG_LEVEL_WRN=y
CONFIG_NET_L2_PTP=y
