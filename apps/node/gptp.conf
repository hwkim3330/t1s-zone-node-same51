# Standard 802.1AS gPTP (Zephyr's stack) on the LAN8651 TSU. gPTP's 01:80:C2:00:00:0E is not in the
# MAC filter: main.c sets the MAC's copy-all bit (NOT Zephyr promiscuous mode, which leaks the RX pool).
# Do not run `ptp lock` at the same time: both servos would steer the same clock.
CONFIG_NET_GPTP=y
CONFIG_NET_GPTP_STATISTICS=y
CONFIG_NET_GPTP_LOG_LEVEL_ERR=y
CONFIG_NET_L2_PTP=n
CONFIG_APP_PTP_MASTER=""
